<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-labelledby="title desc"><title id="title">SafeTrip — illustrative booking preview</title><desc id="desc">Concept visual of route search, schedule comparison and seat selection. Lagos and Abuja are example cities, not live availability.</desc><rect width="760" height="520" fill="#dbe7f4"/><g font-family="Arial, sans-serif"><rect x="38" y="32" width="684" height="456" rx="12" fill="#f8faff" stroke="none"/><rect x="38" y="32" width="684" height="45" rx="12" fill="#123d67" stroke="none"/><rect x="38" y="65" width="684" height="12" rx="0" fill="#123d67" stroke="none"/><text x="65" y="61" font-size="21" fill="#fff" font-weight="700">SafeTrip</text><text x="507" y="60" font-size="11" fill="#d4e7ff" font-weight="700">INTERSTATE / METRO</text><text x="70" y="127" font-size="32" fill="#143953" font-weight="700">Your next city is closer.</text><text x="70" y="159" font-size="15" fill="#586775" font-weight="400">A simpler journey, from search to seat.</text><rect x="70" y="189" width="620" height="62" rx="8" fill="#fff" stroke="#ccd8e7"/><text x="91" y="212" font-size="10" fill="#596775" font-weight="700">FROM</text><text x="91" y="236" font-size="17" fill="#143953" font-weight="700">Lagos</text><text x="255" y="230" font-size="24" fill="#1d5b96" font-weight="400">→</text><text x="316" y="212" font-size="10" fill="#596775" font-weight="700">TO</text><text x="316" y="236" font-size="17" fill="#143953" font-weight="700">Abuja</text><rect x="522" y="203" width="149" height="35" rx="4" fill="#123d67" stroke="none"/><text x="545" y="226" font-size="13" fill="#fff" font-weight="700">Explore routes</text><rect x="70" y="274" width="300" height="176" rx="8" fill="#e5edf8" stroke="none"/><text x="91" y="304" font-size="11" fill="#405b78" font-weight="700">THE BOOKING FLOW</text><text x="91" y="336" font-size="14" fill="#143953" font-weight="400">01   Search a route</text><text x="91" y="365" font-size="14" fill="#143953" font-weight="400">02   Compare schedules</text><text x="91" y="394" font-size="14" fill="#143953" font-weight="400">03   Choose a seat</text><text x="91" y="423" font-size="14" fill="#143953" font-weight="400">04   Review your booking</text><rect x="391" y="274" width="299" height="176" rx="8" fill="#fff" stroke="#ccd8e7"/><text x="412" y="304" font-size="10" fill="#405b78" font-weight="700">SEAT SELECTION / CONCEPT</text><rect x="420" y="321" width="37" height="26" rx="5" fill="#e5edf8" stroke="none"/><text x="433" y="339" font-size="11" fill="#143953" font-weight="400">1</text><rect x="477" y="321" width="37" height="26" rx="5" fill="#e5edf8" stroke="none"/><text x="490" y="339" font-size="11" fill="#143953" font-weight="400">2</text><rect x="546" y="321" width="37" height="26" rx="5" fill="#e5edf8" stroke="none"/><text x="559" y="339" font-size="11" fill="#143953" font-weight="400">3</text><rect x="603" y="321" width="37" height="26" rx="5" fill="#e5edf8" stroke="none"/><text x="616" y="339" font-size="11" fill="#143953" font-weight="400">4</text><rect x="420" y="356" width="37" height="26" rx="5" fill="#e5edf8" stroke="none"/><text x="433" y="374" font-size="11" fill="#143953" font-weight="400">5</text><rect x="477" y="356" width="37" height="26" rx="5" fill="#123d67" stroke="none"/><text x="490" y="374" font-size="11" fill="#fff" font-weight="400">6</text><rect x="546" y="356" width="37" height="26" rx="5" fill="#e5edf8" stroke="none"/><text x="559" y="374" font-size="11" fill="#143953" font-weight="400">7</text><rect x="603" y="356" width="37" height="26" rx="5" fill="#e5edf8" stroke="none"/><text x="616" y="374" font-size="11" fill="#143953" font-weight="400">8</text><rect x="420" y="391" width="37" height="26" rx="5" fill="#e5edf8" stroke="none"/><text x="433" y="409" font-size="11" fill="#143953" font-weight="400">9</text><rect x="477" y="391" width="37" height="26" rx="5" fill="#e5edf8" stroke="none"/><text x="490" y="4