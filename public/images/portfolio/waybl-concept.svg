<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-labelledby="title desc"><title id="title">Waybl — illustrative journey preview</title><desc id="desc">Concept visual showing carrier matching, trip confirmation and secure parcel handover. Not a production screenshot.</desc><rect width="760" height="520" fill="#dce7d0"/><g font-family="Arial, sans-serif"><rect x="38" y="32" width="684" height="456" rx="12" fill="#fbfaf6" stroke="none"/><rect x="38" y="32" width="684" height="45" rx="12" fill="#162c25" stroke="none"/><rect x="38" y="65" width="684" height="12" rx="0" fill="#162c25" stroke="none"/><text x="62" y="61" font-size="20" fill="#fff" font-weight="700">WAYBL</text><text x="525" y="60" font-size="11" fill="#d9e6db" font-weight="700">SEND / CARRY</text><text x="70" y="117" font-size="30" fill="#162c25" font-weight="700">A little spare space.</text><text x="70" y="152" font-size="30" fill="#162c25" font-weight="700">A whole new way to send.</text><text x="70" y="182" font-size="14" fill="#58645e" font-weight="400">A delivery journey, designed around trust.</text><rect x="70" y="209" width="330" height="241" rx="10" fill="#fff" stroke="#d8ded7"/><text x="92" y="241" font-size="11" fill="#59695f" font-weight="700">YOUR PARCEL JOURNEY</text><rect x="92" y="259" width="25" height="25" rx="12" fill="#dce9c8" stroke="none"/><text x="100" y="277" font-size="12" fill="#162c25" font-weight="700">1</text><text x="130" y="276" font-size="16" fill="#162c25" font-weight="700">Find a carrier</text><text x="130" y="297" font-size="12" fill="#58645e" font-weight="400">Someone already going your way</text><rect x="92" y="324" width="25" height="25" rx="12" fill="#dce9c8" stroke="none"/><text x="100" y="342" font-size="12" fill="#162c25" font-weight="700">2</text><text x="130" y="341" font-size="16" fill="#162c25" font-weight="700">Confirm the trip</text><text x="130" y="362" font-size="12" fill="#58645e" font-weight="400">Agree the details before funding</text><rect x="92" y="389" width="25" height="25" rx="12" fill="#dce9c8" stroke="none"/><text x="100" y="407" font-size="12" fill="#162c25" font-weight="700">3</text><text x="130" y="406" font-size="16" fill="#162c25" font-weight="700">Hand over securely</text><text x="130" y="427" font-size="12" fill="#58645e" font-weight="400">Verify with a four-digit code</text><rect x="424" y="209" width="266" height="241" rx="10" fill="#e5ebdc" stroke="none"/><text x="446" y="240" font-size="11" fill="#40513e" font-weight="700">BUILT-IN CHECKPOINTS</text><rect x="446" y="261" width="10" height="10" rx="5" fill="#305b41" stroke="none"/><text x="468" y="271" font-size="13" fill="#243d2b" font-weight="400">Identity verification</text><rect x="446" y="304" width="10" height="10" rx="5" fill="#305b41" stroke="none"/><text x="468" y="314" font-size="13" fill="#243d2b" font-weight="400">Booking-based messaging</text><rect x="446" y="347" width="10" height="10" rx="5" fill="#305b41" stroke="none"/><text x="468" y="357" font-size="13" fill="#243d2b" font-weight="400">Secure handover</text><rect x="446" y="390" width="10" height="10" rx="5" fill="#305b41" stroke="none"/><text x="468" y="400" font-size="13" fill="#243d2b" font-weight="400">Delivery confirmation</text></g></svg>